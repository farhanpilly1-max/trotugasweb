<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TRO — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #c9a84c;
      --gold-light: #e8c97a;
      --deep: #0a0f1e;
      --panel: #111827;
      --panel2: #1a2235;
      --text: #e8e6e0;
      --muted: #7a8499;
      --border: rgba(201,168,76,0.25);
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--deep);
      font-family: 'DM Sans', sans-serif;
      overflow: hidden;
    }

    /* Animated background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(201,168,76,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 80% 90%, rgba(201,168,76,0.06) 0%, transparent 60%);
      pointer-events: none;
    }

    /* Grid lines decoration */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(201,168,76,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(201,168,76,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }

    .login-wrap {
      position: relative;
      z-index: 10;
      display: flex;
      width: 900px;
      max-width: 96vw;
      min-height: 540px;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 40px 100px rgba(0,0,0,0.6), 0 0 0 1px var(--border);
      animation: fadeUp 0.7s cubic-bezier(.16,1,.3,1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(32px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Left decorative panel */
    .login-side {
      flex: 1;
      background: linear-gradient(145deg, var(--panel2) 0%, #0d1525 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 36px;
      border-right: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }

    .login-side::before {
      content: '';
      position: absolute;
      width: 300px; height: 300px;
      border: 1px solid rgba(201,168,76,0.12);
      border-radius: 50%;
      top: -80px; left: -80px;
    }
    .login-side::after {
      content: '';
      position: absolute;
      width: 200px; height: 200px;
      border: 1px solid rgba(201,168,76,0.08);
      border-radius: 50%;
      bottom: -60px; right: -60px;
    }

    .brand-icon {
      width: 72px; height: 72px;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px;
      margin-bottom: 24px;
      box-shadow: 0 8px 32px rgba(201,168,76,0.35);
    }

    .brand-title {
      font-family: 'Playfair Display', serif;
      font-size: 42px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .brand-sub {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      letter-spacing: 0.5px;
      line-height: 1.6;
    }

    .side-features {
      margin-top: 40px;
      width: 100%;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid rgba(201,168,76,0.1);
    }
    .feature-item:last-child { border-bottom: none; }

    .feat-dot {
      width: 8px; height: 8px;
      background: var(--gold);
      border-radius: 50%;
      flex-shrink: 0;
    }

    .feat-text {
      font-size: 13px;
      color: var(--muted);
    }

    /* Right form panel */
    .login-form-panel {
      flex: 1.1;
      background: var(--panel);
      padding: 52px 44px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .form-title {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      color: var(--text);
      margin-bottom: 6px;
    }

    .form-desc {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 36px;
    }

    .alert {
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }
    .alert.error { background: rgba(220,53,69,0.15); border: 1px solid rgba(220,53,69,0.3); color: #f87171; }
    .alert.show { display: block; }

    .field {
      margin-bottom: 20px;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--gold);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .field input {
      width: 100%;
      background: var(--panel2);
      border: 1px solid rgba(201,168,76,0.2);
      border-radius: 10px;
      padding: 13px 16px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    .field input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(201,168,76,0.12);
    }

    .field input::placeholder { color: #3a4459; }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      border: none;
      border-radius: 10px;
      color: #0a0f1e;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: opacity 0.2s, transform 0.15s;
      margin-top: 8px;
    }

    .btn-login:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-login:active { transform: translateY(0); }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
      color: var(--muted);
      font-size: 12px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Google Sign-In button wrapper */
    .google-btn-wrap {
      display: flex;
      justify-content: center;
    }

    /* Override Google button styling */
    #g_id_signin > div {
      width: 100% !important;
    }

    .btn-google-custom {
      width: 100%;
      padding: 13px;
      background: var(--panel2);
      border: 1px solid rgba(201,168,76,0.2);
      border-radius: 10px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 400;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: border-color 0.2s, background 0.2s;
      letter-spacing: 0.3px;
    }

    .btn-google-custom:hover {
      border-color: rgba(201,168,76,0.45);
      background: #1f2d44;
    }

    .btn-google-custom svg { flex-shrink: 0; }

    @media (max-width: 700px) {
      .login-side { display: none; }
      .login-form-panel { padding: 40px 28px; }
    }
  </style>
</head>
<body>

<div class="login-wrap">
  <!-- Left Panel -->
  <div class="login-side">
    <div class="brand-icon">∑</div>
    <div class="brand-title">TRO</div>
    <div class="brand-sub">Teknik Riset Operasi<br/>Platform Komputasi Cerdas</div>
    <div class="side-features">
      <div class="feature-item">
        <div class="feat-dot"></div>
        <span class="feat-text">Metode Simplex — LP Solver</span>
      </div>
      <div class="feature-item">
        <div class="feat-dot"></div>
        <span class="feat-text">Sistem Persamaan Linear</span>
      </div>
      <div class="feature-item">
        <div class="feat-dot"></div>
        <span class="feat-text">Visualisasi Metode Grafik</span>
      </div>
      <div class="feature-item">
        <div class="feat-dot"></div>
        <span class="feat-text">Langkah-langkah Penyelesaian</span>
      </div>
    </div>
  </div>

  <!-- Form Panel -->
  <div class="login-form-panel">
    <h2 class="form-title">Selamat Datang</h2>
    <p class="form-desc">Masuk untuk mengakses platform TRO</p>

    <div class="alert error" id="alertMsg"></div>

    <div class="field">
      <label>Username</label>
      <input type="text" id="username" placeholder="Masukkan username" autocomplete="username" />
    </div>

    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="Masukkan password" autocomplete="current-password" />
    </div>

    <button class="btn-login" onclick="doLogin()">Masuk →</button>

    <div class="divider">atau</div>

    <!-- Google OAuth Button (rendered by Google GSI) -->
    <div id="g_id_onload"
         data-client_id="YOUR_GOOGLE_CLIENT_ID"
         data-callback="handleGoogleLogin"
         data-auto_prompt="false">
    </div>
    <div class="google-btn-wrap">
      <button class="btn-google-custom" onclick="triggerGoogleLogin()">
        <svg width="18" height="18" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Masuk dengan Google
      </button>
    </div>
  </div>
</div>

<script src="js/auth.js"></script>
</body>
</html>
